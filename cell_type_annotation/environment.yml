name: scanpy-env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10

  # Core scientific stack
  #
  # numpy/pandas PINNED, matching alternate_workflow/environment.yml. They were
  # unpinned and happened to resolve to 1.26.4 only because STCAT 1.0.8's pip
  # dependencies drag numpy below 2.0. That is luck, not design: scanpy 1.9.3
  # references np.float_, removed in NumPy 2.0, so any STCAT bump that loosens
  # that transitive pin silently breaks `import scanpy`. The identical omission
  # in load_data/environment.yml left .h5mu loading dead in that image with a
  # fully green test suite.
  - numpy=1.26.4
  - scipy
  - pandas=2.2.0
  - pyyaml

  # h5py comes from PIP, not conda, deliberately. The conda-forge h5py/hdf5
  # builds link the AWS I/O stack (libs2n), which requires OpenSSL >= 3.4
  # symbols. reticulate embeds Python IN-PROCESS in R, and the R process has
  # already loaded the base image's system libcrypto.so.3 (OpenSSL 3.0) - the
  # dynamic linker reuses it, libs2n cannot resolve OPENSSL_3.4.0, and
  # `import h5py` fails at run time even though it passes in a bare Python
  # subprocess at build time. This module reads STCAT's h5ad output through
  # in-process reticulate (anndata::read_h5ad / reticulate::import('anndata')),
  # so it sits on exactly that path. The pip wheel bundles its own libhdf5 with
  # no AWS/s2n linkage, removing the OpenSSL requirement entirely. Same fix as
  # load_data/environment.yml, where this silently broke .h5ad reading.
  - pip
  - pip:
      # h5py MUST equal STCAT 1.0.8's exact pin: STCAT hard-requires
      # h5py==3.12.1, so any other value makes the pip solve impossible.
      # The 3.12.1 wheel bundles its own libhdf5 with no AWS/s2n linkage,
      # so it keeps the OpenSSL fix (that is a conda-build property, not a
      # version one). load_data/environment.yml has no STCAT and stays 3.11.0.
      - h5py==3.12.1
      - scanpy==1.9.3
      - anndata==0.10.9   # keep in step with alternate_workflow/environment.yml
      - scikit-learn==1.2.2
      - umap-learn==0.5.7
      - STCAT==1.0.8
