function:
    build:
        repository: com.genaiz/cite-seq-add-metadata
        tag: com.genaiz/cite-seq-add-metadata
        version: latest
    publish:
        handle: cite-seq-add-metadata
        inputports:
            - description: Seurat object (.rds) from the upstream node
              handle: data
              name: data
            - description: Runtime metadata uploads (xlsx/xls/csv/tsv/txt)
              handle: attachment
              name: attachment
            - description: Runtime configuration (config.json)
              handle: configs
              name: configs
        outputports:
            - description: Seurat object with integrated external metadata
              handle: output
              name: output
        name: CITE-seq Add Metadata
        oem: com.genaiz
        propspecs:
            - key: METADATA_CONFIG
              name: METADATA_CONFIG
              type: STRING
              value: config.json
        type: function
        version: 1.0.0
    run:
        input: run/in
        log: run/log
        output: run/out
        var: run/var
